<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Live - ON4CPN</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* Style des blocs du dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .dash-item {
            background: #111;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            border: 1px solid #00ff99;
            transition: 0.2s;
        }

        .dash-item:hover {
            background: #00ff99;
            color: #000;
        }

        /* Zone de contenu dynamique */
        .tab-content {
            margin-top: 30px;
            display: none !important;
        }

        .tab-content.active {
            display: block !important;
        }

        /* Style des blocs internes */
        .module-box {
            background:#0d0d0d;
            padding:20px;
            border-radius:10px;
            margin-top:20px;
            box-shadow:0 0 10px rgba(0,255,150,0.2);
            text-align:center;
        }
    </style>
</head>

<body>

<header>
    <nav>
        <a href="index.html">Accueil</a>
        <a href="dashboard.html" class="active">Dashboard Live</a>
        <a href="activites.html">Activités</a>
        <a href="galerie.html">Galerie</a>
        <a href="membres.html">Membres</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="content">
    <h2>Dashboard Live</h2>

    <!-- LES 4 BLOCS INTERACTIFS -->
    <div class="dashboard-grid">
        <div class="dash-item" onclick="showTab('propagation')">Propagation HF</div>
        <div class="dash-item" onclick="showTab('qso')">Compteur QSO Live</div>
        <div class="dash-item" onclick="showTab('heure')">Heure locale + UTC</div>
        <div class="dash-item" onclick="showTab('dx')">Activations en cours</div>
    </div>

    <!-- PROPAGATION HF -->
    <div id="propagation" class="tab-content">
        <h2 style="color:#00ff99;">Propagation HF</h2>

        <div class="module-box">
            <h3 style="color:#00ff99; margin-bottom:15px;">HF Propagation – DXView</h3>

            <iframe 
                src="https://hf.dxview.org/"
                style="width:100%; height:900px; border:none; border-radius:10px;"
            ></iframe>
        </div>
    </div>

    <!-- QSO -->
    <div id="qso" class="tab-content">
        <h2 style="color:#00ff99;">Compteur QSO Live</h2>
        <div class="module-box">
            <p style="color:white;">Module QSO à venir.</p>
        </div>
    </div>

    <!-- HEURE -->
    <div id="heure" class="tab-content">
        <h2 style="color:#00ff99;">Heure locale + UTC</h2>
        <div class="module-box">
            <p style="color:white;">Module horloge à venir.</p>
        </div>
    </div>

    <!-- DX CLUBLOG -->
    <div id="dx" class="tab-content">
        <div class="module-box">
            <h2 style="color:#00ff99; margin-bottom:15px; font-weight:600;">
                Club Log – DX Report
            </h2>

            <iframe 
                src="https://clublog.org/dxreport.html"
                style="width:100%; height:900px; border:none; border-radius:10px;"
            ></iframe>
        </div>
    </div>

</section>

<!-- SCRIPT POUR LES ONGLETS -->
<script>
document.addEventListener("DOMContentLoaded", function() {

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(div => {
            div.classList.remove('active');
        });
        document.getElementById(id).classList.add('active');
    }

    window.showTab = showTab;

    /* Onglet affiché par défaut */
    showTab('propagation');
});
</script>

</body>
</html>
